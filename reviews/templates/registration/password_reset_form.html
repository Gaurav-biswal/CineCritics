{% extends "reviews/base.html" %}
{% block content %}
<div class="auth-container">
    <h1 class="page-title">Forgot Password?</h1>
    <p class="auth-subtitle">Enter your email address to get a reset link.</p>
    <form method="post" class="review-form auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="signup-btn submit-btn">Send Reset Email</button>
    </form>
</div>
{% endblock %}
