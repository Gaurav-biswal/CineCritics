{% extends 'reviews/base.html' %}

{% block content %}
<h1 class="page-title">My Watchlist</h1>

<div class="movie-grid">
    {% for movie in movies %}
        <a href="{% url 'movie_detail' movie.slug %}" class="movie-link">
            <div class="movie-card">
                <img src="{{ movie.image }}" alt="{{ movie.title }}">
                <div class="movie-content">
                    <h2>{{ movie.title }}</h2>
                    <p>{{ movie.avg_rating|floatformat:1 }}</p>
                </div>
            </div>
        </a>
    {% empty %}
        <div class="watchlist-empty">
            <p class="auth-subtitle">Your watchlist is empty. Go find some movies!</p>
            <a href="{% url 'explore' %}" class="explore-btn" style="text-decoration:none;">Browse Movies</a>
        </div>
    {% endfor %}
</div>
{% endblock %}
